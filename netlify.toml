[build]
  command = "yarn build:netlify"
  publish = "netlify"

# script-src allows index.html's inline trailing-slash redirect by hash; it
# can't be an external file, since it must run before relative URLs resolve.
# tests/securityHeaders.test.ts fails if the script and this hash drift apart.
# Ace loads from cdnjs, pulls its modes from there, runs its HTML linter in a
# blob: worker and injects <style> tags (hence 'unsafe-inline'). albertcss
# @imports Google Fonts.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-FGALV05D4g7G4BENEzItcsKln/YAzSyPZhwTWZS+i2g=' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://albertcss.craigmcn.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
